{% extends "base.html" %}
{% block title %}Log In - StockLens{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-sm-8 col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="text-center mb-1">StockLens</h2>
                <p class="text-center text-muted mb-4">Log in to your account</p>

                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}
                {% if success %}
                <div class="alert alert-success" role="alert">{{ success }}</div>
                {% endif %}

                <form method="POST" action="/login" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required value="{{ username or '' }}" autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log In</button>
                </form>

                <p class="text-center mt-3 mb-0">
                    New here? <a href="/signup">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
