<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StockLens{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <a href="#mainContent" class="sl-skip-link">Skip to main content</a>

    {% if session.get('user_id') %}
    <nav class="navbar navbar-expand-lg navbar-dark mb-4" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">StockLens</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse flex-grow-0" id="navMenu">
                <div class="d-flex flex-column flex-lg-row gap-2 mt-2 mt-lg-0">
                    <a class="btn btn-outline-light btn-sm" href="/dashboard">Dashboard</a>
                    <a class="btn btn-outline-light btn-sm" href="/compare">Compare</a>
                    <form method="POST" action="/logout" class="d-inline">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button type="submit" class="btn btn-outline-light btn-sm w-100">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="flex-grow-1" id="mainContent">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="text-center small py-4 mt-4">
        Built with Claude as part of the AB Talks 60-Day Claude AI Challenge.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
